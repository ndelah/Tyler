# Tyler defaults for macOS. SUPER = Fn/Globe.
# Shift adds a secondary action. Standard Command shortcuts pass through.
# User settings override this file; default_bindings=false replaces the table.

[general]
# Independent from the desktop navigator.
tiling_enabled = true
super = "fn"
gaps_in = 5
gaps_out = 10
border_size = 4
border_color = "#586B4A"
layout = "dwindle"
default_bindings = true

[dwindle]
preserve_split = true
force_split = 2
split_ratio = 0.5

# Prototype: enable to compare AX window motion against immediate tiling.
# Native Mission Control transitions always belong to macOS.
[animations]
enabled = false
duration_ms = 160

[apps]
terminal = "Terminal"
browser = "Safari"
file_manager = "Finder"

[rules]
float = ["Tyler", "System Settings", "System Information", "Calculator", "Archive Utility", "1Password"]

[bindings]
"SUPER + RETURN" = "launch terminal"
"SUPER + B" = "launch browser"
"SUPER + C" = "launch browser"
"SUPER + O" = "launch file_manager"
"SUPER + F" = "launch file_manager"
"SUPER + K" = "keybindings"
"SUPER + T" = "togglefloating"
"SUPER + J" = "togglesplit"
"SUPER + SHIFT + F" = "fullscreen"
"SUPER + TAB" = "workspace e+1"
"SUPER + SHIFT + TAB" = "workspace e-1"
"SUPER + GRAVE" = "workspace previous"
"SUPER + BRACKETLEFT" = "cyclenext"
"SUPER + BRACKETRIGHT" = "cyclenext prev"
"SUPER + APOSTROPHE" = "focusmonitor next"
"SUPER + BACKSLASH" = "focusmonitor prev"
"SUPER + V" = "togglespecialworkspace scratchpad"
"SUPER + SHIFT + V" = "movetoworkspacesilent special:scratchpad"
"SUPER + R" = "reload"
"SUPER + ESCAPE" = "exit"
"SUPER + LEFT" = "movefocus l"
"SUPER + SHIFT + LEFT" = "swapwindow l"
"SUPER + RIGHT" = "movefocus r"
"SUPER + SHIFT + RIGHT" = "swapwindow r"
"SUPER + UP" = "movefocus u"
"SUPER + SHIFT + UP" = "swapwindow u"
"SUPER + DOWN" = "movefocus d"
"SUPER + SHIFT + DOWN" = "swapwindow d"
# Resize: minus shrinks, equal expands; Shift selects height.
# Option = a little (25 pt), no extra modifier = 100 pt, Control = a lot (300 pt).
"SUPER + MINUS" = "resizeactive -100 0"
"SUPER + EQUAL" = "resizeactive 100 0"
"SUPER + SHIFT + MINUS" = "resizeactive 0 -100"
"SUPER + SHIFT + EQUAL" = "resizeactive 0 100"
"SUPER + ALT + MINUS" = "resizeactive -25 0"
"SUPER + ALT + EQUAL" = "resizeactive 25 0"
"SUPER + SHIFT + ALT + MINUS" = "resizeactive 0 -25"
"SUPER + SHIFT + ALT + EQUAL" = "resizeactive 0 25"
"SUPER + CTRL + MINUS" = "resizeactive -300 0"
"SUPER + CTRL + EQUAL" = "resizeactive 300 0"
"SUPER + CTRL + SHIFT + MINUS" = "resizeactive 0 -300"
"SUPER + CTRL + SHIFT + EQUAL" = "resizeactive 0 300"
"SUPER + code:10" = "workspace 1"
"SUPER + SHIFT + code:10" = "movetoworkspace 1"
"SUPER + code:11" = "workspace 2"
"SUPER + SHIFT + code:11" = "movetoworkspace 2"
"SUPER + code:12" = "workspace 3"
"SUPER + SHIFT + code:12" = "movetoworkspace 3"
"SUPER + code:13" = "workspace 4"
"SUPER + SHIFT + code:13" = "movetoworkspace 4"
"SUPER + code:14" = "workspace 5"
"SUPER + SHIFT + code:14" = "movetoworkspace 5"
"SUPER + code:15" = "workspace 6"
"SUPER + SHIFT + code:15" = "movetoworkspace 6"
"SUPER + code:16" = "workspace 7"
"SUPER + SHIFT + code:16" = "movetoworkspace 7"
"SUPER + code:17" = "workspace 8"
"SUPER + SHIFT + code:17" = "movetoworkspace 8"
"SUPER + code:18" = "workspace 9"
"SUPER + SHIFT + code:18" = "movetoworkspace 9"
"SUPER + code:19" = "workspace 10"
"SUPER + SHIFT + code:19" = "movetoworkspace 10"

# Desktop controls inside the macOS menu bar, independent of tiling.
[navigator]
enabled = true
placement = "center" # "left", "center", or "right" in available menu-bar space.
# Names/icons are keyed by native Space ID (use Settings → Desktops).
# [navigator.labels."379"]
# name = "Development"
# icon = "sf:terminal" # Or an emoji; leave empty to display the name.
