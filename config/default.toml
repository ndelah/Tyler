# Tyler defaults for macOS. SUPER = Control + Option + Command.
# Shift adds a secondary action. Standard Command shortcuts pass through.
# User settings override this file; default_bindings=false replaces the table.

[general]
super = "ctrl+alt+cmd"
gaps_in = 5
gaps_out = 10
border_size = 2
layout = "dwindle"
default_bindings = true

[dwindle]
preserve_split = true
force_split = 2
split_ratio = 0.5

[apps]
terminal = "Terminal"
browser = "Safari"
file_manager = "Finder"

[rules]
float = ["System Settings", "System Information", "Calculator", "Archive Utility", "1Password"]

[bindings]
"SUPER + RETURN" = "launch terminal"
"SUPER + B" = "launch browser"
"SUPER + E" = "launch file_manager"
"SUPER + W" = "killactive"
"SUPER + T" = "togglefloating"
"SUPER + J" = "togglesplit"
"SUPER + F" = "fullscreen"
"SUPER + M" = "fullscreen maximized"
"SUPER + TAB" = "workspace e+1"
"SUPER + SHIFT + TAB" = "workspace e-1"
"SUPER + GRAVE" = "workspace previous"
"SUPER + BRACKETRIGHT" = "cyclenext"
"SUPER + BRACKETLEFT" = "cyclenext prev"
"SUPER + S" = "togglespecialworkspace scratchpad"
"SUPER + SHIFT + S" = "movetoworkspacesilent special:scratchpad"
"SUPER + R" = "reload"
"SUPER + ESCAPE" = "exit"
"SUPER + LEFT" = "movefocus l"
"SUPER + SHIFT + LEFT" = "swapwindow l"
"SUPER + RIGHT" = "movefocus r"
"SUPER + SHIFT + RIGHT" = "swapwindow r"
"SUPER + UP" = "movefocus u"
"SUPER + SHIFT + UP" = "swapwindow u"
"SUPER + DOWN" = "movefocus d"
"SUPER + SHIFT + DOWN" = "swapwindow d"
"SUPER + code:10" = "workspace 1"
"SUPER + SHIFT + code:10" = "movetoworkspace 1"
"SUPER + code:11" = "workspace 2"
"SUPER + SHIFT + code:11" = "movetoworkspace 2"
"SUPER + code:12" = "workspace 3"
"SUPER + SHIFT + code:12" = "movetoworkspace 3"
"SUPER + code:13" = "workspace 4"
"SUPER + SHIFT + code:13" = "movetoworkspace 4"
"SUPER + code:14" = "workspace 5"
"SUPER + SHIFT + code:14" = "movetoworkspace 5"
"SUPER + code:15" = "workspace 6"
"SUPER + SHIFT + code:15" = "movetoworkspace 6"
"SUPER + code:16" = "workspace 7"
"SUPER + SHIFT + code:16" = "movetoworkspace 7"
"SUPER + code:17" = "workspace 8"
"SUPER + SHIFT + code:17" = "movetoworkspace 8"
"SUPER + code:18" = "workspace 9"
"SUPER + SHIFT + code:18" = "movetoworkspace 9"
"SUPER + code:19" = "workspace 10"
"SUPER + SHIFT + code:19" = "movetoworkspace 10"
"SUPER + code:20" = "resizeactive -100 0"
"SUPER + code:21" = "resizeactive 100 0"
"SUPER + SHIFT + code:20" = "resizeactive 0 -100"
"SUPER + SHIFT + code:21" = "resizeactive 0 100"
"SUPER + COMMA" = "resizeactive -25 0"
"SUPER + PERIOD" = "resizeactive 25 0"
"SUPER + SHIFT + COMMA" = "resizeactive 0 -25"
"SUPER + SHIFT + PERIOD" = "resizeactive 0 25"
